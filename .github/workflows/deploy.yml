# Deploy to cPanel via FTP on every push to master.
# Only uploads public/ — PHP source, JS, CSS, HTML.
# Runtime files (state.json, pool-cache, logs) are created by PHP on the server.
#
# Required GitHub repository secrets:
#   FTP_SERVER   — cPanel FTP host (e.g. ftp.example.com)
#   FTP_USERNAME — cPanel FTP username
#   FTP_PASSWORD — cPanel FTP password

name: deploy to cpanel
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: public/
